[project]
name = "alignment-tool"
version = "0.1.0"
description = "Calcium imaging -> CYP11B2 IHC alignment tool (v1)"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "tifffile",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
alignment-tool = "alignment_tool.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
